# tmpfiles.d/meshlink.conf
# Executed by systemd-tmpfiles-setup.service on every boot.
# Creates and permissions all paths meshlink needs before any service starts.
#
# Columns: Type Path Mode User Group Age
#
# Persistent state (survives reboots)
d  /var/lib/meshlink          0770  root  meshlink  -
d  /var/lib/meshlink/updates  0770  root  meshlink  -

# Runtime files (recreated each boot from /run, which is a tmpfs)
d  /run/meshlink              0775  root  meshlink  -
f  /run/meshlink/meshlink.pid 0660  root  meshlink  -

# /var/run is a symlink to /run on modern systems, so the above covers it.
# The hardcoded paths in the binary (/var/run/meshlink.pid, /var/run/meshlink.sock)
# resolve correctly through that symlink.
